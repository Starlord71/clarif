# Clarif - single-command distributable stack.
#
#   docker compose up --build
#
# Brings up PostgreSQL, the Laravel web container (php artisan serve) and a
# queue worker, with no manual setup. Runtime configuration lives in
# .env.docker, which is committed for demo/local use only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clarif
      POSTGRES_USER: clarif
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clarif", "-d", "clarif"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    command: php artisan queue:work --tries=3

volumes:
  postgres-data:
  app-storage:
  app-logs:
